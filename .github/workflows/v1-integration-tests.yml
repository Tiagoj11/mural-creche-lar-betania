name: V1 - integração API e painel administrativo

on:
  push:
    branches:
      - V1
  pull_request:
    branches:
      - V1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integracao:
    name: Express + SQLite + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - name: Checkout da revisão submetida
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências versionadas
        run: npm ci --no-audit --no-fund

      - name: Verificar sintaxe dos arquivos executados
        run: |
          node --check server.js
          node --check database.js
          node --check public/app.js
          node --check tests/admin-listagens.test.js
          node --check tests/admin-http.integration.test.js
          node --check tests/admin-browser.e2e.cjs
          node --check tests/lote2-integration.e2e.cjs
          node --check tests/lote3-frontend-browser.e2e.cjs
          node --check tests/infra-auth-ops.test.js

      - name: Executar testes existentes (HTTP real e SQLite descartável)
        run: npm test

      # Somente no runner: não altera package.json nem package-lock.json.
      # Playwright é necessário para testar a página real no Chromium headless.
      - name: Instalar ferramenta de navegador isolada
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1

      - name: Instalar Chromium headless e dependências do runner
        run: npx playwright install --with-deps chromium

      - name: Exercitar painel real com Express e SQLite descartáveis
        run: node --test tests/admin-browser.e2e.cjs

      # Obrigatório em push para V1 e PR destinado a V1. Preservar os testes anteriores.
      - name: Aceite Lote 2 - API SQLite Chromium imagens e notificações
        run: node --test tests/lote2-integration.e2e.cjs

      # A suíte Lote 3 existe na V1, mas não estava incluída no workflow permanente.
      - name: Aceite Frontend Lote 3 - PWA, imagens, cache e token
        run: node --test tests/lote3-frontend-browser.e2e.cjs

      # Os PRs independentes não contêm ainda os dois módulos da funcionalidade.
      # O gate deve FALHAR explicitamente, nunca ficar verde com auth ignorada.
      # Na composição Backend + Frontend + DevOps ambos devem existir e passar.
      - name: Gate de testes de autenticação HTTP e migração
        shell: bash
        run: |
          shopt -s nullglob
          candidatos=(tests/*auth*.test.js)
          casos=()
          for arquivo in "${candidatos[@]}"; do
            # Testes DevOps de backup não são substitutos de autenticação HTTP.
            if [[ "$arquivo" == tests/infra-* ]]; then continue; fi
            casos+=("$arquivo")
          done
          if (( ${#casos[@]} == 0 )); then
            echo "::error::Suíte Backend auth HTTP/SQLite ausente. Integração Backend pendente; não aprovar como cobertura auth."
            exit 1
          fi
          printf 'Executando teste(s) Backend auth: %s\n' "${casos[*]}"
          node --test "${casos[@]}"

      - name: Gate de autenticação Chromium - login, sessão e CSRF
        shell: bash
        run: |
          shopt -s nullglob
          casos=(tests/*auth*.e2e.cjs)
          if (( ${#casos[@]} > 0 )); then
            printf 'Executando E2E auth separado: %s\n' "${casos[*]}"
            node --test "${casos[@]}"
          elif [[ -f admin-auth.js ]] &&
               grep -Fq 'bootstrapToken' tests/admin-browser.e2e.cjs &&
               grep -Fq '#auth-login' tests/admin-browser.e2e.cjs &&
               grep -Fq 'csrf' tests/admin-browser.e2e.cjs &&
               grep -Fq 'independent' tests/admin-browser.e2e.cjs; then
            # E2E novo do PR Frontend está incorporado à suíte admin-browser,
            # que JÁ foi executada com Chromium real no passo anterior.
            echo 'E2E auth incluído na suíte admin-browser executada acima: bootstrap, sessão, CSRF e sessões independentes.'
          else
            echo "::error::E2E auth Chromium não presente (nem em suíte separada nem no admin-browser)."
            exit 1
          fi

      # Não registrar valores de credenciais nem publicar artefatos da sessão.

      - name: Verificar ausência de banco temporário no workspace
        if: always()
        shell: bash
        run: |
          if [ -e banco.db ]; then
            echo "::error::Banco SQLite encontrado na raiz do workspace de CI"
            exit 1
          fi
          echo "Nenhum banco SQLite foi escrito na raiz do workspace"
